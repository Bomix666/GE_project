<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Каталог — GLOBAL EFFECTS</title>
    <meta name="description" content="Оборудование для спецэффектов и расходные материалы GLOBAL EFFECTS: конфетти-машины, криоэффекты, тяжелый дым, пена, конфетти, серпантин, искусственный снег." />
    <!-- @include head.html -->
    <link rel="stylesheet" href="/src/styles/pages/catalog.css" />
  </head>
  <body data-page="catalog">
    <!-- @include icons.html -->
    <!-- @include header.html -->

    <main id="main" class="catalog" data-catalog>
      <section class="cat-hero" aria-labelledby="cat-title">
        <div class="container">
          <nav aria-label="Хлебные крошки"><ol class="crumbs" role="list" data-crumbs><li><a href="/">Главная</a></li></ol></nav>
          <div class="cat-hero__grid">
            <div class="cat-hero__copy">
              <p class="eyebrow" data-cat-group>Каталог</p>
              <h1 class="cat-hero__title" id="cat-title" data-cat-title>Каталог</h1>
              <p class="cat-hero__meta tabular" data-cat-meta></p>
              <form class="cat-search" role="search" data-cat-search hidden>
                <label class="visually-hidden" for="cat-q">Искать в каталоге</label>
                <input class="field__input" id="cat-q" name="q" type="search" placeholder="Название, модель, эффект" />
                <button type="submit" class="btn btn--primary btn--md"><span class="btn__label">Найти</span><span class="btn__icon" aria-hidden="true"><svg width="18" height="18"><use href="#i-search" /></svg></span></button>
              </form>
            </div>
            <figure class="cat-hero__media" data-cat-media aria-hidden="true"></figure>
          </div>
          <nav class="cat-siblings" aria-label="Другие категории" data-cat-siblings></nav>
        </div>
      </section>

      <div class="container cat-layout">
        <aside class="filters" aria-label="Фильтры" data-filters-home>
          <div class="filters__inner" data-filters></div>
        </aside>

        <section class="cat-results" aria-labelledby="results-title">
          <h2 class="visually-hidden" id="results-title">Товары</h2>
          <div class="toolbar" data-toolbar>
            <p class="toolbar__count tabular" id="results-count" data-count aria-live="polite"></p>
            <div class="toolbar__chips chips" data-active-chips></div>
            <div class="toolbar__controls">
              <button type="button" class="btn btn--secondary btn--sm toolbar__filters-btn" data-filters-open aria-haspopup="dialog">
                <span class="btn__label">Фильтры <span class="tabular" data-filters-badge></span></span>
                <span class="btn__icon" aria-hidden="true"><svg width="16" height="16"><use href="#i-filter" /></svg></span>
              </button>
              <label class="sort">
                <span class="sort__label">Сортировка</span>
                <select class="sort__select" data-sort>
                  <option value="default">По умолчанию</option>
                  <option value="price-asc">Сначала дешевле</option>
                  <option value="price-desc">Сначала дороже</option>
                  <option value="name">По названию</option>
                </select>
              </label>
            </div>
          </div>

          <div class="pgrid pgrid--wide" data-grid aria-busy="true"></div>

          <div class="cat-more" data-more-wrap hidden>
            <p class="text-3 tabular" data-shown></p>
            <span class="cat-more__bar" aria-hidden="true"><span data-shown-bar></span></span>
            <button type="button" class="btn btn--secondary btn--lg" data-more>
              <span class="btn__label">Показать ещё</span><span class="btn__icon" aria-hidden="true"><svg width="18" height="18"><use href="#i-plus" /></svg></span>
            </button>
          </div>
        </section>
      </div>

      <aside class="section cat-help" aria-label="Помощь с выбором">
        <div class="container cat-help__inner">
          <div>
            <p class="eyebrow">Нужна консультация?</p>
            <p class="cat-help__title">Поможем подобрать оборудование и расходные материалы под вашу площадку</p>
          </div>
          <div class="cat-help__actions">
            <a class="btn btn--primary btn--lg" href="tel:+74996505078"><span class="btn__label">+7 (499) 650-50-78</span><span class="btn__icon" aria-hidden="true"><svg width="20" height="20"><use href="#i-phone" /></svg></span></a>
            <a class="btn btn--secondary btn--lg" href="https://globaleffects.ru/price/price.pdf" data-route="doc" data-path="/price/price.pdf" target="_blank" rel="noopener"><span class="btn__label">Прайс-лист, PDF</span><span class="btn__icon" aria-hidden="true"><svg width="20" height="20"><use href="#i-download" /></svg></span></a>
          </div>
        </div>
      </aside>
    </main>

    <!-- @include footer.html -->
    <script type="module" src="/src/js/pages/catalog.js"></script>
  </body>
</html>
